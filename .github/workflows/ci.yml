name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, so the ML adapters cannot silently rot between sprints.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: services/api/requirements*.txt

      # The ML extras are deliberately NOT installed here (ADR-0002). The stub backends
      # cover the whole suite, which keeps CI at seconds instead of a multi-GB download.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install numpy soundfile soxr

      - name: Lint
        run: ruff check app tests

      - name: Test
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --junitxml=junit.xml

      # A failing run says only "Process completed with exit code 1" on the summary page,
      # and the log behind it needs a sign-in. Anyone looking at a red build - including
      # somebody without push access - then has no idea what broke. Annotations are public,
      # so the failures go there.
      - name: Say what failed
        if: failure()
        run: |
          python - <<'PYEOF'
          import pathlib, xml.etree.ElementTree as ET

          report = pathlib.Path("junit.xml")
          if not report.exists():
              print("::error::pytest produced no junit.xml - it died before running tests")
              raise SystemExit(0)

          bad = 0
          for case in ET.parse(report).getroot().iter("testcase"):
              for kind in ("failure", "error"):
                  node = case.find(kind)
                  if node is None:
                      continue
                  bad += 1
                  where = f"{case.get('classname', '')}::{case.get('name', '')}"
                  first = (node.get("message") or node.text or "").strip().splitlines()
                  detail = first[0][:400] if first else kind
                  print(f"::error title={where}::{detail}")
          print(f"::error::{bad} test(s) failed. Full output is in the job log.")
          PYEOF

      # The domain layer is the part that must not rot: it is pure, it is the product's
      # actual logic, and there is no excuse for leaving it uncovered.
      - name: Enforce domain coverage
        run: coverage report --include="app/domain/*" --fail-under=85

      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: services/api/coverage.xml
          if-no-files-found: error

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      # No `cache: npm`. It needs `cache-dependency-path` to match a real file, and this
      # repository has no `apps/web/package-lock.json` - `setup-node` then fails the job
      # outright, before installing anything. That is why every Web run has been red: not
      # a build error, a cache configuration pointing at a file that was never committed.
      # The install step below already says `npm ci || npm install`, which is the same
      # admission made in a place that does not abort.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  ml-smoke:
    name: ML backends (nightly)
    # Multi-gigabyte installs and model downloads: too slow for every push, but the
    # adapters still need something that actually exercises them.
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[ml]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ML extras
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ml.txt

      - name: Run the backend smoke tests
        run: pytest -m ml -q
