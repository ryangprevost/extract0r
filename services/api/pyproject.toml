[project]
name = "extract0r-api"
version = "0.1.0"
description = "Extract0r API: stem separation, automatic tablature, reference mastering."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# Everything needed to run the tests. No ML stack required - the stub backends cover it.
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
]
# The heavy backends. Separate extra so CI and the front-end dev loop stay fast.
ml = [
    "demucs>=4.0",
    "torch>=2.4",
    "torchaudio>=2.4",
    "basic-pitch>=0.4",
    "librosa>=0.10",
    "numpy>=1.26",
    "matchering>=2.0",
    "soundfile>=0.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# `Depends(...)` in a default argument is the FastAPI idiom, not a bug.
ignore = ["B008"]
